# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/

title: InfosecSapper.com
tagline: Security knowledge, attack paths, and system behaviour
description: Technical reference material covering Windows internals, identity systems, attack paths, adversary tradecraft, detection engineering, and security research.
url: "https://infosecsapper.com"
author: InfosecSapper
social:
  name: infosecsapper
  links:
    - https://github.com/infosecsapper
    - https://keybase.io/thesapper
    - https://www.reddit.com/user/InfosecSapper
    - https://www.linkedin.com/in/richardpiccone

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/default.jpg
  - scope:
      type: posts
    values:
      layout: post

name: InfosecSapper.com
baseurl: "" # the subpath of your site, e.g. /blog
lang: en_GB

repository: infosecsapper/infosecsapper.github.io
github_username:  infosecsapper

# Build settings
theme: jekyll-theme-midnight
markdown: kramdown
kramdown:
    input: GFM
    syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include: [_pages]

collections:
  windows:
    output: true
    title: Windows Components
    description: Windows processes, services, authentication and operating system behaviour.
    weight: 10
  active_directory:
    output: true
    title: Active Directory
    description: Active Directory, Kerberos, delegation, trusts and identity systems.
    weight: 20
  attack_paths:
    output: true
    title: Attack Paths
    description: Analysis of privilege escalation and compromise paths.
    weight: 30
  attck:
    output: true
    title: MITRE ATT&CK Research
    description: ATT&CK techniques, mappings and analysis.
    weight: 40
  detection:
    output: true
    title: Detection Engineering
    description: Detection opportunities, analytics and hunting guidance.
    weight: 50
  tradecraft:
    output: true
    title: Adversary Tradecraft
    description: Offensive techniques and operator workflows.
    weight: 60
  archive:
    output: true
    title: Archive
    description: Archived content and research.
    weight: 70

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
