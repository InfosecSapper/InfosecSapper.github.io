---
layout: default
---
<article>
    <h1>{{ page.title }}</h1>
    {{content}}
    <hr>
    <p class="article-meta">Published {{ page.date | date: "%d %B %Y" }} · Updated {{ page.modified | default: page.date | date: "%d %B %Y" }}</p>
</article>
<aside>
    <section class="share" aria-label="Share this post">
        <h3>Share and discuss this article:</h3>
        <ul>
          <li><a href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ page.url | absolute_url | escape }}&amp;title={{ page.title | escape }}&amp;summary={{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}&amp;source={{ page.url | absolute_url | escape }}" target="_blank" rel="noopener" title="Share on LinkedIn" aria-label="Share on LinkedIn" class="fab fa-linkedin fa-2x"></a></li>
          <li><a href="https://www.reddit.com/submit?url={{ page.url | absolute_url | escape }}&amp;title={{ page.title | escape }}&amp;text={{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}" target="_blank" rel="noopener" title="Share on Reddit" aria-label="Share on Reddit" class="fab fa-reddit fa-2x"></a></li>
          <li><a href="https://news.ycombinator.com/submitlink?u={{ page.url | absolute_url | escape }}&amp;t={{ page.title | escape}}" target="_blank" rel="noopener" title="Share on Hacker News" aria-label="Share on Hacker News" class="fab fa-hacker-news fa-2x"></a></li>
          <li><a href="https://share.joinmastodon.org/?text={{ page.title | escape }} {{ page.url | absolute_url | escape }}" target="_blank" rel="noopener" title="Share on Mastodon" aria-label="Share on Mastodon" class="fab fa-mastodon fa-2x"></a></li>
          <li><a href="https://telegram.me/share/url?text={{ page.title | escape }}&amp;url={{ page.url | absolute_url | escape }}" target="_blank" rel="noopener" title="Share on Telegram" aria-label="Share on Telegram" class="fab fa-telegram-plane fa-2x"></a></li>
          <li><a href="mailto:?subject={{ page.title }}&body={{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}:%20{{ page.url | absolute_url | escape }}" target="_blank" rel="noopener" title="Share by email" aria-label="Share by email" class="fas fa-envelope fa-2x"></a></li>
        </ul>
        <h3>Follow updates:</h3>
        <ul>
          <li><a href="{{ '/feed.xml' | relative_url }}" title="Subscribe via RSS" aria-label="Subscribe via RSS" class="fas fa-rss fa-2x"></a></li>
        </ul>
      </section>
</aside>

<div class="scroll-top">
    <a href="#" class="fas fa-arrow-circle-up fa-2x" title="Scroll to top" aria-label="Scroll to Top" aria-hidden="false"></a>
</div>
